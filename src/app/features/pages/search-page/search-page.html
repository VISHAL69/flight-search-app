<div class="max-w-70rem mx-auto px-4 py-4">
  <h2 class="text-2xl font-bold mb-4">Flight Search</h2>
  <app-search-forms (search)="onSearch($event)"></app-search-forms>
  @if (viewModel$ | async; as vm) {
    @if (vm.state === 'loading') {
      <app-loading-spinner />
    } @else if (vm.state === 'error') {
      <app-error-banner  />
    } @else if (vm.state === 'success') {
      <div class="grid">
        <div class="col-12 md:col-3">
          <app-filter-panel
            [flights]="vm.allFlights"
            [initialFilters]="initialFilters"
            (filtersChange)="onFiltersChange($event)"
          />
        </div>
        <div class="col-12 md:col-9">
          <app-flight-list [flights]="vm.flights" (viewDetails)="onViewDetails($event)" />
        </div>
      </div>
    }
  }
</div>
