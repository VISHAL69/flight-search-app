<p-card styleClass="shadow-1 mb-4">
  <div class="flex justify-content-between align-items-center mb-3">
    <h3 class="text-base font-semibold m-0">Filters</h3>
    <p-button label="Reset" [text]="true" size="small" (onClick)="onReset()" />
  </div>

  <div class="field mb-3">
    <label for="maxPrice" class="block text-sm font-semibold mb-2">Max Price</label>
    <p-inputnumber
      inputId="maxPrice"
      [ngModel]="maxPrice"
      (ngModelChange)="onPriceChange($event)"
      mode="currency"
      currency="INR"
      locale="en-IN"
      fluid="true"
      placeholder="Any"
      styleClass="w-full"
    />
  </div>

  <p-divider />

  <div class="mb-3">
    <div class="text-sm font-semibold mb-2">Stops</div>
    @for (stop of stopOptions; track stop) {
      <div class="flex align-items-center mb-2">
        <p-checkbox
          [inputId]="'stop-' + stop"
          [binary]="true"
          [ngModel]="selectedStops.includes(stop)"
          (ngModelChange)="onStopToggle(stop, $event)"
        />
        <label [for]="'stop-' + stop" class="ml-2 text-sm">{{ stopLabel(stop) }}</label>
      </div>
    }
  </div>

  <p-divider />

  <div>
    <div class="text-sm font-semibold mb-2">Airline</div>
    @for (airline of availableAirlines; track airline) {
      <div class="flex align-items-center mb-2">
        <p-checkbox
          [inputId]="'airline-' + airline"
          [binary]="true"
          [ngModel]="selectedAirlines.includes(airline)"
          (ngModelChange)="onAirlineToggle(airline, $event)"
        />
        <label [for]="'airline-' + airline" class="ml-2 text-sm">{{ airline }}</label>
      </div>
    }
  </div>
</p-card>
